spring.application.name=taskmanager

# Server Port (Supports Cloud PORT env var e.g. Render / Heroku / Railway)
server.port=${PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION (SPRING AUTO-DETECTS DRIVER FROM URL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./flowsyncdb;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=15000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console (Development Only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console